[project]
name = "echolot-provenance"
version = "0.1.0"
description = "ECHOLOT provenance flow demonstrator (FR3.5)"
requires-python = "==3.12.*"
dependencies = [
    "echolot-prov",
    "echolot-core",
    "echolot-enrich-demo",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/echolot-prov", "services/core", "services/enrich-demo"]

[tool.uv.sources]
echolot-prov = { workspace = true }
echolot-core = { workspace = true }
echolot-enrich-demo = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "jsonschema[format-nongpl]>=4.23"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
