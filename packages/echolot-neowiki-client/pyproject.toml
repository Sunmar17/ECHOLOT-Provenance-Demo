[project]
name = "echolot-neowiki-client"
version = "0.1.0"
description = "Writes ECHOLOT provenance envelopes into NeoWiki over the MediaWiki Action API"
# Library, not an application: no ceiling, matching echolot-prov's own rule.
# The demo's own runtime is pinned to 3.12 by the workspace root instead.
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
